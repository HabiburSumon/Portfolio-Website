<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C5CE7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764BA2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2C3E50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A252F;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)"/>

  <!-- Decorative circles -->
  <circle cx="50" cy="50" r="80" fill="rgba(255,255,255,0.05)"/>
  <circle cx="350" cy="350" r="100" fill="rgba(255,255,255,0.05)"/>
  <circle cx="380" cy="30" r="40" fill="rgba(255,255,255,0.08)"/>

  <!-- Body / Shirt -->
  <path d="M100 400 C100 320 140 280 200 280 C260 280 300 320 300 400 Z" fill="url(#shirtGrad)"/>

  <!-- Collar -->
  <path d="M175 285 L200 320 L225 285 L200 275 Z" fill="#FFFFFF" opacity="0.9"/>

  <!-- Neck -->
  <rect x="175" y="240" width="50" height="50" rx="10" fill="#D4A574"/>

  <!-- Head -->
  <ellipse cx="200" cy="180" rx="75" ry="85" fill="#D4A574"/>

  <!-- Ears -->
  <ellipse cx="125" cy="185" rx="12" ry="18" fill="#C89B6C"/>
  <ellipse cx="275" cy="185" rx="12" ry="18" fill="#C89B6C"/>

  <!-- Hair -->
  <path d="M125 170 C125 90 275 90 275 170 C275 140 260 120 240 115 C250 100 235 85 215 90 C220 70 190 65 180 80 C165 65 145 75 145 95 C130 100 125 130 125 170 Z" fill="#2C2C2C"/>

  <!-- Eyebrows -->
  <path d="M155 165 Q170 158 185 163" stroke="#2C2C2C" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M215 163 Q230 158 245 165" stroke="#2C2C2C" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Eyes -->
  <ellipse cx="170" cy="180" rx="10" ry="8" fill="#FFFFFF"/>
  <ellipse cx="230" cy="180" rx="10" ry="8" fill="#FFFFFF"/>
  <circle cx="172" cy="181" r="5" fill="#2C2C2C"/>
  <circle cx="228" cy="181" r="5" fill="#2C2C2C"/>
  <circle cx="174" cy="179" r="2" fill="#FFFFFF"/>
  <circle cx="230" cy="179" r="2" fill="#FFFFFF"/>

  <!-- Nose -->
  <path d="M200 185 L195 205 Q200 210 205 205 Z" fill="#C89B6C"/>

  <!-- Mouth (smile) -->
  <path d="M180 220 Q200 235 220 220" stroke="#8B5E3C" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Glasses -->
  <circle cx="170" cy="180" r="18" fill="none" stroke="#333333" stroke-width="3"/>
  <circle cx="230" cy="180" r="18" fill="none" stroke="#333333" stroke-width="3"/>
  <path d="M188 180 L212 180" stroke="#333333" stroke-width="3"/>
  <path d="M152 178 L140 175" stroke="#333333" stroke-width="3"/>
  <path d="M248 178 L260 175" stroke="#333333" stroke-width="3"/>

  <!-- Beard -->
  <path d="M160 215 C160 250 240 250 240 215 C235 245 225 255 200 255 C175 255 165 245 160 215 Z" fill="#2C2C2C" opacity="0.8"/>

  <!-- Badge -->
  <circle cx="320" cy="80" r="30" fill="#FFFFFF" opacity="0.9"/>
  <text x="320" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#6C5CE7">HS</text>
</svg>
